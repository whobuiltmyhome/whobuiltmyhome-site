name: Verify Analytics transport
on:
  push:
    branches: [analytics-transport-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'whobuiltmyhome/whobuiltmyhome-site' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/analytics.test.mjs
      - run: node scripts/verify-analytics-transport.mjs
