name: Verify mobile launch flow
on:
  push:
    paths:
      - 'scripts/verify-mobile-launch.mjs'
      - '.github/workflows/verify-mobile-launch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'whobuiltmyhome/whobuiltmyhome-site' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-mobile-launch.mjs
